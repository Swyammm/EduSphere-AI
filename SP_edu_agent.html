<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SP_edu_AI</title>
<style>
  /* Universal box-sizing reset — ensures padding/border are included in element dimensions */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── CSS CUSTOM PROPERTIES (Design Tokens) ──────────────────────────────
     All colours, radii and shadows are defined here so they can be reused
     consistently across every component.                                   */
  :root {
    --bg: #0f1117;           /* Page background (darkest layer) */
    --surface: #1a1d2e;      /* Cards, sidebar, header surface */
    --surface2: #222540;     /* Inputs, toolbar — one step lighter than surface */
    --border: rgba(255,255,255,0.08);  /* Subtle divider / outline colour */
    --accent: #6c63ff;       /* Primary brand purple (buttons, focus rings) */
    --accent2: #48cfad;      /* Secondary teal (AI avatar, headings, status dot) */
    --accent3: #ff6b6b;      /* Danger / error red */
    --text: #e8eaf0;         /* Default body text */
    --muted: #7b82a0;        /* De-emphasised text (labels, timestamps, placeholders) */
    --user-bubble: #6c63ff;  /* Background of user chat bubbles */
    --ai-bubble: #1e2235;    /* Background of AI chat bubbles */
    --glass: rgba(255,255,255,0.04);         /* Glass-morphism fill */
    --glass-border: rgba(255,255,255,0.10);  /* Glass-morphism border */
    --radius: 14px;          /* Default border-radius for cards / bubbles */
    --shadow: 0 8px 32px rgba(0,0,0,0.4);   /* Card drop-shadow */
  }

  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── HEADER ──────────────────────────────────────────────────────────────
     Fixed top bar: app logo + title on the left, live-status indicator on
     the right.  backdrop-filter adds a frosted-glass blur behind it.       */
  header {
    background: linear-gradient(135deg, #1a1d2e 0%, #232645 100%);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    backdrop-filter: blur(12px);
    z-index: 10;
  }
  .header-brand { display: flex; align-items: center; gap: 12px; }
  .header-logo {
    width: 40px; height: 40px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 800; color: #fff; flex-shrink: 0;
  }
  .header-title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .header-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  /* Animated green dot that pulses to indicate the AI is live/online */
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent2); box-shadow: 0 0 8px var(--accent2);
    animation: pulse 2s infinite;
  }
  /* Pulse keyframes: fades dot opacity between full and 40% every 2 s */
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .status-label { font-size: 12px; color: var(--accent2); font-weight: 500; }

  /* ── APP LAYOUT ──────────────────────────────────────────────────────────
     Horizontal flex row that fills the remaining viewport height below the
     header.  overflow:hidden prevents the whole page from scrolling.       */
  .app-body {
    display: flex;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  /* ── SIDEBAR ─────────────────────────────────────────────────────────────
     Fixed-width left panel that holds mode-switch buttons (Student / Teacher
     / Parent) and action buttons (Clear, Export).                          */
  .sidebar {
    width: 220px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 16px 12px;
    gap: 6px;
    flex-shrink: 0;
    overflow-y: auto;
  }
  .sidebar-section {
    font-size: 10px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 8px 8px 4px;
  }
  .sidebar-btn {
    display: flex; align-items: center; gap: 10px;
    background: transparent; border: 1px solid transparent;
    border-radius: 10px; padding: 10px 12px; cursor: pointer;
    color: var(--muted); font-size: 13px; font-weight: 500;
    transition: all 0.2s; text-align: left; width: 100%;
  }
  .sidebar-btn:hover { background: var(--glass); border-color: var(--glass-border); color: var(--text); }
  .sidebar-btn.active {
    background: linear-gradient(135deg, rgba(108,99,255,0.18), rgba(72,207,173,0.10));
    border-color: rgba(108,99,255,0.4); color: var(--text);
  }
  .sidebar-btn .icon { font-size: 16px; }
  .sidebar-divider { height: 1px; background: var(--border); margin: 8px 0; }
  /* Destructive actions (e.g. clear chat) get a red hover highlight */
  .sidebar-btn.danger:hover {
    background: rgba(255,107,107,0.12);
    border-color: rgba(255,107,107,0.3);
    color: var(--accent3);
  }

  /* ── MAIN CONTENT ────────────────────────────────────────────────────────
     Takes the remaining width beside the sidebar.  flex-direction:column
     stacks: profile panel → toolbar → chat area → input area.            */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }

  /* ── PROFILE PANEL ───────────────────────────────────────────────────────
     Row of dropdowns (Grade, Subject, Language, Difficulty) that let the
     user personalise the AI's responses before chatting.                  */
  .profile-panel {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 10px;
    align-items: center; flex-shrink: 0;
  }
  .profile-label {
    font-size: 11px; color: var(--muted); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em; margin-right: 2px;
  }
  .profile-select {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 12px;
    padding: 5px 10px; cursor: pointer; outline: none; transition: border-color 0.2s;
  }
  .profile-select:hover, .profile-select:focus { border-color: var(--accent); }
  .profile-group { display: flex; align-items: center; gap: 6px; }

  /* ── QUICK-ACTION TOOLBAR ────────────────────────────────────────────────
     Pre-built prompt shortcuts (Explain, Quiz, Lesson Plan, Homework,
     Assessment).  Clicking a button fills the textarea with a ready-made
     prompt that the user can send immediately.                            */
  .toolbar {
    background: var(--surface2); border-bottom: 1px solid var(--border);
    padding: 8px 20px; display: flex; gap: 8px; flex-wrap: wrap; flex-shrink: 0;
  }
  .toolbar-btn {
    background: var(--glass); border: 1px solid var(--glass-border);
    border-radius: 8px; padding: 6px 14px; font-size: 12px; font-weight: 500;
    color: var(--muted); cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; gap: 6px;
  }
  .toolbar-btn:hover {
    background: linear-gradient(135deg, rgba(108,99,255,0.2), rgba(72,207,173,0.1));
    border-color: var(--accent); color: var(--text); transform: translateY(-1px);
  }

  /* ── CHAT AREA ───────────────────────────────────────────────────────────
     Scrollable column that holds all message rows.  flex:1 makes it expand
     to fill the space between the toolbar and the input area.             */
  .chat-area {
    flex: 1; min-height: 0; overflow-y: auto; padding: 24px 24px 12px;
    display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth;
  }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 2px; }

  /* ── MESSAGE ROWS ────────────────────────────────────────────────────────
     Each .msg-row contains an avatar + .msg-content (bubble + timestamp).
     User messages are right-aligned by reversing the flex direction.      */
  .msg-row { display: flex; gap: 10px; align-items: flex-end; animation: fadeUp 0.3s ease; }
  /* Slide-up fade-in animation played when a new message is added to the DOM */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg-row.user { flex-direction: row-reverse; }
  .msg-avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700;
  }
  .msg-avatar.ai { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  .msg-avatar.user-av { background: linear-gradient(135deg, #ff6b6b, #ffa07a); color: #fff; }
  .msg-content { max-width: 70%; display: flex; flex-direction: column; gap: 4px; }
  .msg-row.user .msg-content { align-items: flex-end; }
  .msg-bubble {
    padding: 12px 16px; border-radius: var(--radius);
    font-size: 13.5px; line-height: 1.65; position: relative; box-shadow: var(--shadow);
  }
  .msg-bubble.ai {
    background: var(--ai-bubble); border: 1px solid var(--border);
    border-bottom-left-radius: 4px; color: var(--text);
  }
  .msg-bubble.user {
    background: linear-gradient(135deg, var(--user-bubble), #8b83ff);
    border-bottom-right-radius: 4px; color: #fff;
  }
  .msg-bubble pre {
    background: rgba(0,0,0,0.3); border-radius: 8px; padding: 10px 12px;
    margin: 8px 0; overflow-x: auto; font-size: 12px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg-bubble code {
    background: rgba(0,0,0,0.25); border-radius: 4px;
    padding: 1px 5px; font-size: 12px;
  }
  .msg-bubble strong { color: var(--accent2); }
  .msg-bubble h3 { font-size: 14px; margin-bottom: 6px; color: var(--accent2); }
  .msg-bubble ul, .msg-bubble ol { padding-left: 18px; margin: 6px 0; }
  .msg-bubble li { margin-bottom: 4px; }
  .msg-time { font-size: 10px; color: var(--muted); padding: 0 4px; }

  /* ── TYPING INDICATOR ────────────────────────────────────────────────────
     Three bouncing dots shown while waiting for the AI API response.      */
  .typing-indicator {
    display: flex; gap: 4px; align-items: center; padding: 14px 18px;
    background: var(--ai-bubble); border: 1px solid var(--border);
    border-radius: var(--radius); border-bottom-left-radius: 4px; width: fit-content;
  }
  .typing-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted); animation: typingBounce 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingBounce {
    0%,60%,100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* ── INPUT AREA ──────────────────────────────────────────────────────────
     Sticky bottom panel with the auto-growing textarea and the Send button.
     The textarea expands up to 120 px tall as the user types more text.   */
  .input-area {
    padding: 16px 24px 20px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .input-row {
    display: flex; gap: 10px; align-items: flex-end;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 14px; transition: border-color 0.2s;
  }
  /* Highlight the input container's border when the textarea is focused */
  .input-row:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(108,99,255,0.12);
  }
  #userInput {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-size: 13.5px; line-height: 1.5; resize: none;
    max-height: 120px; min-height: 22px; font-family: inherit;
  }
  #userInput::placeholder { color: var(--muted); }
  #sendBtn {
    width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; cursor: pointer; color: #fff; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; box-shadow: 0 4px 12px rgba(108,99,255,0.35);
  }
  #sendBtn:hover { transform: scale(1.06); box-shadow: 0 6px 18px rgba(108,99,255,0.5); }
  #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* ── WELCOME CARD ────────────────────────────────────────────────────────
     Displayed as the very first message when the chat loads (or is cleared).
     Lists the five AI agent capabilities as clickable pills.              */
  .welcome-card {
    background: linear-gradient(135deg, rgba(108,99,255,0.12), rgba(72,207,173,0.08));
    border: 1px solid rgba(108,99,255,0.25);
    border-radius: var(--radius); padding: 24px 28px; margin: 8px 0;
  }
  .welcome-card h2 {
    font-size: 18px; font-weight: 700; margin-bottom: 8px;
    background: linear-gradient(135deg, #a29bfe, var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .welcome-card p { font-size: 13px; color: var(--muted); line-height: 1.7; margin-bottom: 14px; }
  .welcome-agents {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px;
  }
  .agent-pill {
    background: var(--glass); border: 1px solid var(--glass-border);
    border-radius: 8px; padding: 8px 12px; font-size: 12px; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .agent-pill span { color: var(--text); font-weight: 500; }

  /* ── ERROR TOAST ─────────────────────────────────────────────────────────
     Inline error message rendered inside the chat when an API call fails.
     Uses a red-tinted background to visually distinguish it from normal AI
     messages.                                                             */
  .error-toast {
    background: rgba(255,107,107,0.15); border: 1px solid rgba(255,107,107,0.35);
    border-radius: 8px; padding: 10px 14px; font-size: 12.5px; color: #ff6b6b;
    display: flex; align-items: center; gap: 8px;
  }

  /* ── RESPONSIVE (≤ 700 px) ───────────────────────────────────────────────
     On small screens the sidebar collapses to icon-only width, text labels
     are hidden, and paddings are tightened for better space usage.        */
  @media (max-width: 700px) {
    .sidebar { width: 54px; padding: 10px 6px; }
    .sidebar-btn span:last-child, .sidebar-section { display: none; }
    .sidebar-btn { justify-content: center; padding: 10px; }
    .profile-panel { padding: 8px 12px; gap: 8px; }
    .toolbar { padding: 6px 12px; gap: 6px; }
    .chat-area { padding: 16px 14px 8px; }
    .input-area { padding: 12px 14px 16px; }
    .msg-content { max-width: 85%; }
    .header { padding: 12px 14px; }
    .header-sub { display: none; }
    .welcome-agents { grid-template-columns: 1fr; }
  }

  /* ── CUSTOM SCROLLBAR (WebKit / Chromium) ────────────────────────────────
     Slims down the native scrollbar to a 4 px thumb to reduce visual clutter
     while keeping it interactive.                                          */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 2px; }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-brand">
    <div class="header-logo">E</div>
    <div>
      <div class="header-title">EduSphere AI</div>
      <div class="header-sub">AI-Powered Personalized Learning Platform</div>
    </div>
  </div>
  <div class="header-right">
    <div class="status-dot"></div>
    <div class="status-label">Live</div>
  </div>
</header>

<!-- APP BODY -->
<div class="app-body">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-section">Mode</div>
    <button class="sidebar-btn active" onclick="setMode('student')" id="btn-student">
      <span class="icon">&#127891;</span><span>Student</span>
    </button>
    <button class="sidebar-btn" onclick="setMode('teacher')" id="btn-teacher">
      <span class="icon">&#128218;</span><span>Teacher</span>
    </button>
    <button class="sidebar-btn" onclick="setMode('parent')" id="btn-parent">
      <span class="icon">&#128106;</span><span>Parent</span>
    </button>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section">Actions</div>
    <button class="sidebar-btn" onclick="clearChat()">
      <span class="icon">&#128465;</span><span>Clear Chat</span>
    </button>
    <button class="sidebar-btn" onclick="exportChat()">
      <span class="icon">&#128190;</span><span>Export Chat</span>
    </button>
  </aside>

  <!-- MAIN -->
  <div class="main">

    <!-- PROFILE PANEL -->
    <div class="profile-panel">
      <div class="profile-group">
        <span class="profile-label">Grade</span>
        <select class="profile-select" id="gradeSelect">
          <option>Grade 1</option><option>Grade 2</option><option>Grade 3</option>
          <option>Grade 4</option><option>Grade 5</option><option selected>Grade 6</option>
          <option>Grade 7</option><option>Grade 8</option><option>Grade 9</option>
          <option>Grade 10</option><option>Grade 11</option><option>Grade 12</option>
        </select>
      </div>
      <div class="profile-group">
        <span class="profile-label">Subject</span>
        <select class="profile-select" id="subjectSelect">
          <option>Mathematics</option><option>Science</option><option>English</option>
          <option>Gujarati</option><option>Social Studies</option><option>Hindi</option>
          <option>Computer Science</option><option>General</option>
        </select>
      </div>
      <div class="profile-group">
        <span class="profile-label">Language</span>
        <select class="profile-select" id="langSelect">
          <option value="english">English</option>
          <option value="gujarati">Gujarati</option>
        </select>
      </div>
      <div class="profile-group">
        <span class="profile-label">Difficulty</span>
        <select class="profile-select" id="diffSelect">
          <option>Beginner</option><option selected>Intermediate</option><option>Advanced</option>
        </select>
      </div>
    </div>

    <!-- TOOLBAR -->
    <div class="toolbar">
      <button class="toolbar-btn" onclick="quickAction('explain')">&#128161; Explain</button>
      <button class="toolbar-btn" onclick="quickAction('quiz')">&#128221; Quiz</button>
      <button class="toolbar-btn" onclick="quickAction('lessonplan')">&#128203; Lesson Plan</button>
      <button class="toolbar-btn" onclick="quickAction('homework')">&#128214; Homework</button>
      <button class="toolbar-btn" onclick="quickAction('assessment')">&#9989; Assessment</button>
    </div>

    <!-- CHAT AREA -->
    <div class="chat-area" id="chatArea"></div>

    <!-- INPUT AREA -->
    <div class="input-area">
      <div class="input-row">
        <textarea id="userInput" rows="1"
          placeholder="Ask anything... e.g. 'Explain photosynthesis' or 'Create a quiz on fractions'"></textarea>
        <button id="sendBtn" onclick="sendMessage()" title="Send">&#10148;</button>
      </div>
    </div>

  </div><!-- /main -->
</div><!-- /app-body -->

<script>
// ==================================================
// CONFIGURATION — replace with your Groq API key
// ==================================================
// API_KEY  : Groq API key used to authenticate requests.
// MODEL    : LLM model ID served by Groq (LLaMA 3.3 70B).
// API_URL  : Groq's OpenAI-compatible chat completions endpoint.
var API_KEY = "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";
var MODEL   = "llama-3.3-70b-versatile";
var API_URL = "https://api.groq.com/openai/v1/chat/completions";

// ==================================================
// STATE
// ==================================================
// conversationHistory : Array of {role, content} objects sent to the API on
//                       every request so the model has full chat context.
// currentMode         : Active persona — "student" | "teacher" | "parent".
// isLoading           : Prevents sending a new message while one is in flight.
var conversationHistory = [];
var currentMode = "student";
var isLoading = false;

// ==================================================
// SYSTEM PROMPT
// ==================================================
/**
 * buildSystemPrompt()
 * Reads the current profile selections (grade, subject, language, difficulty)
 * and assembles the system-level instruction string that shapes how the AI
 * responds.  This is prepended to every API request so the model always knows
 * the educational context.
 */
function buildSystemPrompt() {
  // Read the current values from the profile-panel dropdowns
  var grade   = document.getElementById("gradeSelect").value;
  var subject = document.getElementById("subjectSelect").value;
  var lang    = document.getElementById("langSelect").value;
  var diff    = document.getElementById("diffSelect").value;

  // Concatenate the multi-agent persona instructions with the live session context
  return "You are EduSphere AI, an intelligent educational assistant for government and rural schools in Gujarat, India.\n" +
    "You operate as five specialized agents simultaneously:\n\n" +
    "1. PERSONALIZED LEARNING RECOMMENDATION AGENT — Recommend study materials, adapt to learning levels, suggest exercises and learning paths.\n" +
    "2. AI LESSON PLAN & CONTENT GENERATION AGENT — Generate lesson plans (Learning Objectives, Introduction, Teaching Activities, Student Activities, Assessment, Homework), worksheets, classroom activities.\n" +
    "3. STUDENT PERFORMANCE & LEARNING ANALYTICS AGENT — Analyze progress, identify weak areas, flag students needing support, generate improvement recommendations. Always include: Strengths, Weaknesses, Risk Level, Recommendations.\n" +
    "4. AUTOMATED ASSESSMENT & FEEDBACK AGENT — Generate quizzes, evaluate answers, provide feedback: Score | Correct Answers | Incorrect Answers | Areas for Improvement | Suggested Next Steps.\n" +
    "5. TEACHER ASSISTANT & CLASSROOM SUPPORT AGENT — Answer teacher questions, generate reports, assist with classroom management.\n\n" +
    "CURRENT SESSION:\n" +
    "- User role: " + currentMode + "\n" +
    "- Grade: " + grade + "\n" +
    "- Subject: " + subject + "\n" +
    "- Language preference: " + lang + "\n" +
    "- Difficulty level: " + diff + "\n\n" +
    "RULES:\n" +
    "- Identify whether the user is a student, teacher, or parent. If unclear, ask.\n" +
    (lang === "gujarati"
      ? "- Respond primarily in Gujarati. Use English only for technical terms when necessary.\n"
      : "- Respond in English. You may include brief Gujarati phrases for encouragement.\n") +
    "- Explain concepts simply, with clear examples, then a practice question, then a short summary.\n" +
    "- Encourage students with positive reinforcement.\n" +
    "- Adapt difficulty to " + diff + " level for " + grade + ".\n" +
    "- Use structured formatting: headings, bullet points, numbered steps.\n" +
    "- Never generate harmful, discriminatory, or inappropriate content.\n" +
    "- For rural Gujarat context: use local examples (farming, village life, local festivals, rivers, geography) when relevant.\n" +
    "- Always be warm, supportive, and educational.";
}

// ==================================================
// MODE MANAGEMENT
// ==================================================
/**
 * setMode(mode)
 * Switches the active user persona (student / teacher / parent).
 * Updates the sidebar highlight and adds a context-aware greeting message
 * to the chat so the AI acknowledges the new role.
 */
function setMode(mode) {
  currentMode = mode;

  // Remove "active" class from all sidebar buttons, then re-apply it to the chosen one
  var btns = document.querySelectorAll(".sidebar-btn");
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove("active");
  document.getElementById("btn-" + mode).classList.add("active");

  // Each mode gets a tailored welcome message injected directly into the chat
  var greetings = {
    student: "Student mode activated! I am here to help you learn. What subject are you studying today? You can use the toolbar above for quick actions.",
    teacher: "Teacher mode activated! I can help you create lesson plans, worksheets, assessments, performance reports, and more. What do you need today?",
    parent:  "Parent mode activated! I can share your child's learning progress, suggest tips for supporting learning at home, and answer any questions. How can I help?"
  };
  addMessage("ai", greetings[mode]);
}

// QUICK ACTIONS
// ==================================================
/**
 * quickAction(type)
 * Pre-fills the textarea with a context-aware prompt based on the toolbar
 * button clicked (explain / quiz / lessonplan / homework / assessment).
 * The user can review or edit the prompt before pressing Send.
 */
function quickAction(type) {
  var subject = document.getElementById("subjectSelect").value;
  var grade   = document.getElementById("gradeSelect").value;

  // Template prompts — each injected with the current grade and subject values
  var prompts = {
    explain:    "Explain a key concept in " + subject + " for " + grade + " in a simple way with a real-life example from Gujarat.",
    quiz:       "Create a 5-question multiple choice quiz on " + subject + " for " + grade + ". Mark the correct answers at the end.",
    lessonplan: "Generate a complete lesson plan for " + subject + " at " + grade + " level. Include: Learning Objectives, Introduction, Teaching Activities, Student Activities, Assessment, and Homework.",
    homework:   "Create a meaningful homework assignment for " + subject + " at " + grade + " level. Include 3-5 questions of varying difficulty.",
    assessment: "Generate a short formative assessment for " + subject + " at " + grade + ". Include a mix of question types and provide a full answer key."
  };
  var input = document.getElementById("userInput");
  input.value = prompts[type];              // Insert the chosen template text
  input.style.height = "auto";             // Reset height before re-measuring
  input.style.height = Math.min(input.scrollHeight, 120) + "px"; // Resize to fit content
  input.focus();                            // Move cursor to textarea for quick editing
}

// ==================================================
// SEND MESSAGE
// ==================================================
/**
 * sendMessage()
 * Main function triggered by the Send button or Enter key.
 * Flow:
 *  1. Validate input (non-empty, not already loading).
 *  2. Render the user's bubble and push it to conversationHistory.
 *  3. Show the typing indicator and disable the Send button.
 *  4. Build the full messages array (system prompt + history) and POST to Groq.
 *  5. On success: render the AI reply, store it in conversationHistory.
 *  6. On HTTP / network errors: render an error toast and remove the failed
 *     user message from history so the turn can be retried cleanly.
 */
function sendMessage() {
  var input = document.getElementById("userInput");
  var text  = input.value.trim();
  if (!text || isLoading) return; // Bail out if empty or a request is already pending

  // Clear the textarea and reset its height
  input.value = "";
  input.style.height = "auto";

  // Show the user's message in the chat and record it in history
  addMessage("user", text);
  conversationHistory.push({ role: "user", content: text });

  // Lock the UI while waiting for the API response
  isLoading = true;
  document.getElementById("sendBtn").disabled = true;
  var typingId = showTyping(); // Returns a unique ID used to remove the indicator later

  // Build messages array: system prompt is always first so the model has context
  var messages = [{ role: "system", content: buildSystemPrompt() }];
  for (var i = 0; i < conversationHistory.length; i++) {
    messages.push(conversationHistory[i]);
  }

  // POST request to Groq's chat completions endpoint
  fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + API_KEY
    },
    body: JSON.stringify({
      model: MODEL,
      messages: messages,
      temperature: 0.7,   // Balanced creativity vs. factual accuracy
      max_tokens: 1500,   // Cap response length to avoid excessively long replies
      stream: false       // Receive the full response at once (no streaming)
    })
  })
  .then(function(response) {
    removeTyping(typingId); // Hide the bouncing dots as soon as a response arrives
    if (!response.ok) {
      // HTTP-level error (e.g. 401 Unauthorised, 429 Rate Limit)
      return response.json().catch(function() { return {}; }).then(function(err) {
        var msg = (err && err.error && err.error.message) ? err.error.message : ("HTTP " + response.status + ": " + response.statusText);
        addMessage("ai", null, true, "API Error: " + msg);
        conversationHistory.pop(); // Remove the unsent user message from history
      });
    }
    return response.json().then(function(data) {
      // Extract the AI's reply text from the OpenAI-compatible response shape
      var reply = (data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content)
        ? data.choices[0].message.content
        : "Sorry, I received an empty response. Please try again.";
      conversationHistory.push({ role: "assistant", content: reply }); // Keep history in sync
      addMessage("ai", reply);
    });
  })
  .catch(function(err) {
    // Network-level error (offline, DNS failure, CORS, etc.)
    removeTyping(typingId);
    conversationHistory.pop(); // Roll back the user's message so it can be retried
    if (err.name === "TypeError") {
      addMessage("ai", null, true, "Network error: Unable to reach the Groq API. Please check your internet connection.");
    } else {
      addMessage("ai", null, true, "Unexpected error: " + err.message);
    }
  })
  .finally(function() {
    // Always re-enable the UI regardless of success or failure
    isLoading = false;
    document.getElementById("sendBtn").disabled = false;
    document.getElementById("userInput").focus();
  });
}

// ==================================================
// MESSAGE RENDERING
// ==================================================
/**
 * addMessage(role, text, isError, errorText)
 * Creates and appends one message row to the chat area.
 *
 * @param {string}  role      - "user" or "ai"
 * @param {string}  text      - Message body (null when isError is true)
 * @param {boolean} isError   - If true, render an error-toast instead of a bubble
 * @param {string}  errorText - Error description shown inside the toast
 *
 * DOM structure injected into #chatArea:
 *   .msg-row [.user]
 *     .msg-avatar [.user-av | .ai]
 *     .msg-content
 *       .msg-bubble [.user | .ai]  ← normal message
 *       OR .error-toast            ← API / network error
 *       .msg-time
 */
function addMessage(role, text, isError, errorText) {
  isError   = isError   || false;
  errorText = errorText || "";

  var area = document.getElementById("chatArea");
  var row  = document.createElement("div");
  // Adding the "user" class reverses flex-direction, right-aligning the bubble
  row.className = "msg-row" + (role === "user" ? " user" : "");

  // Avatar circle — "U" for user, "E" (EduSphere) for the AI
  var avatar = document.createElement("div");
  avatar.className = "msg-avatar " + (role === "user" ? "user-av" : "ai");
  avatar.textContent = role === "user" ? "U" : "E";

  var content = document.createElement("div");
  content.className = "msg-content";

  if (isError) {
    // Render a red error toast instead of a regular chat bubble
    var toast = document.createElement("div");
    toast.className = "error-toast";
    toast.textContent = errorText;
    content.appendChild(toast);
  } else {
    var bubble = document.createElement("div");
    bubble.className = "msg-bubble " + (role === "user" ? "user" : "ai");
    // User text is plain-escaped to prevent XSS; AI text is parsed for Markdown
    bubble.innerHTML = role === "user" ? escapeHTML(text) : markdownToHTML(text);
    content.appendChild(bubble);
  }

  // Timestamp displayed below the bubble
  var timeEl = document.createElement("div");
  timeEl.className = "msg-time";
  timeEl.textContent = getTime();
  content.appendChild(timeEl);

  row.appendChild(avatar);
  row.appendChild(content);
  area.appendChild(row);
  area.scrollTop = area.scrollHeight; // Auto-scroll to the newest message
}

/**
 * showTyping()
 * Injects a temporary animated three-dot row into the chat to signal that
 * the AI is processing.  Returns the unique DOM id so it can be removed
 * once the real response arrives.
 */
function showTyping() {
  var area = document.getElementById("chatArea");
  var row  = document.createElement("div");
  var id   = "typing-" + Date.now(); // Unique id based on timestamp
  row.id   = id;
  row.className = "msg-row";
  row.innerHTML =
    '<div class="msg-avatar ai">E</div>' +
    '<div class="msg-content">' +
      '<div class="typing-indicator">' +
        '<div class="typing-dot"></div>' +
        '<div class="typing-dot"></div>' +
        '<div class="typing-dot"></div>' +
      '</div>' +
    '</div>';
  area.appendChild(row);
  area.scrollTop = area.scrollHeight;
  return id; // Caller passes this back to removeTyping() when the reply arrives
}

/**
 * removeTyping(id)
 * Removes the typing-indicator row from the DOM once the AI reply arrives.
 */
function removeTyping(id) {
  var el = document.getElementById(id);
  if (el) el.parentNode.removeChild(el);
}

// ==================================================
// UTILITIES
// ==================================================
/**
 * getTime()
 * Returns the current time as a 12-hour "H:MM AM/PM" string,
 * used as the timestamp shown below each chat bubble.
 */
function getTime() {
  var d    = new Date();
  var h    = d.getHours();
  var m    = d.getMinutes();
  var ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12; // Convert 0 (midnight) to 12
  return h + ":" + (m < 10 ? "0" + m : m) + " " + ampm;
}

/**
 * escapeHTML(str)
 * Converts HTML special characters to their entity equivalents and turns
 * newlines into <br> tags.  Applied to user messages to prevent XSS attacks
 * when setting innerHTML.
 */
function escapeHTML(str) {
  return String(str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/\n/g, "<br>");
}

/**
 * escapeCode(str)
 * Lighter HTML-escape used inside <pre>/<code> blocks — only escapes the
 * three characters that would break HTML rendering (&, <, >).  Newlines are
 * preserved as-is so indentation inside code blocks is kept intact.
 */
function escapeCode(str) {
  return String(str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/**
 * markdownToHTML(text)
 * Converts a subset of Markdown returned by the AI into safe HTML.
 * Supported syntax (in processing order to avoid conflicts):
 *   • Fenced code blocks (``` ... ```)
 *   • Inline code (`...`)
 *   • Bold (**text** or __text__)
 *   • Italic (*text*)
 *   • Headings (#, ##, ### — all rendered as <h3>)
 *   • Horizontal rule (---)
 *   • Unordered and ordered lists (- / * / 1.)
 *   • Paragraph breaks (double newline) and single line breaks
 */
function markdownToHTML(text) {
  // Code blocks
  text = text.replace(/```[\w]*\n?([\s\S]*?)```/g, function(_, c) {
    return "<pre>" + escapeCode(c.trim()) + "</pre>";
  });
  // Inline code
  text = text.replace(/`([^`]+)`/g, function(_, c) {
    return "<code>" + escapeCode(c) + "</code>";
  });
  // Bold
  text = text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/__(.+?)__/g, "<strong>$1</strong>");
  // Italic
  text = text.replace(/\*([^*\n]+?)\*/g, "<em>$1</em>");
  // H3 / H2
  text = text.replace(/^### (.+)$/gm, "<h3>$1</h3>");
  text = text.replace(/^## (.+)$/gm, "<h3>$1</h3>");
  text = text.replace(/^# (.+)$/gm, "<h3>$1</h3>");
  // Horizontal rule
  text = text.replace(/^---+$/gm, "<hr style='border:none;border-top:1px solid rgba(255,255,255,0.1);margin:8px 0;'>");
  // List items
  text = text.replace(/^\s*[-*] (.+)$/gm, "<li>$1</li>");
  text = text.replace(/^\s*\d+\. (.+)$/gm, "<li>$1</li>");
  // Wrap consecutive <li> in <ul>
  text = text.replace(/(<li>[\s\S]*?<\/li>)(\s*<li>[\s\S]*?<\/li>)*/g, function(m) {
    return "<ul>" + m + "</ul>";
  });
  // Line breaks
  text = text.replace(/\n{2,}/g, "</p><p style='margin-top:8px;'>");
  text = text.replace(/\n/g, "<br>");
  return text;
}

// ==================================================
// CLEAR / EXPORT
// ==================================================
/**
 * clearChat()
 * Resets the conversation: wipes the conversationHistory array, empties the
 * chat DOM, and re-renders the welcome card so the user can start fresh.
 */
function clearChat() {
  conversationHistory = [];
  document.getElementById("chatArea").innerHTML = "";
  renderWelcome();
}

/**
 * exportChat()
 * Serialises all visible chat messages (excluding the typing indicator) to a
 * plain-text string and triggers a browser download as "edusphere-chat.txt".
 * Skips rows that have no .msg-bubble (e.g. the welcome card's agent pills).
 */
function exportChat() {
  var area = document.getElementById("chatArea");
  var rows = area.querySelectorAll(".msg-row");
  if (!rows.length) { alert("No messages to export."); return; }

  // Build the plain-text content with a header and a separator
  var txt = "EduSphere AI - Chat Export\n" + new Date().toLocaleString() + "\n\n";
  txt += "================================================\n\n";

  for (var i = 0; i < rows.length; i++) {
    var row    = rows[i];
    var isUser = row.classList.contains("user"); // true = student/teacher/parent side
    var bubble = row.querySelector(".msg-bubble");
    var timeEl = row.querySelector(".msg-time");
    if (bubble) {
      // Format: "[Speaker] HH:MM AM/PM\n<message text>\n"
      txt += "[" + (isUser ? "You" : "EduSphere AI") + "] " + (timeEl ? timeEl.textContent : "") + "\n";
      txt += bubble.innerText + "\n\n"; // innerText strips HTML tags cleanly
    }
  }

  // Create an in-memory Blob and trigger a download via a temporary <a> element
  var blob = new Blob([txt], { type: "text/plain" });
  var a    = document.createElement("a");
  a.href   = URL.createObjectURL(blob);
  a.download = "edusphere-chat.txt";
  document.body.appendChild(a);
  a.click();                          // Programmatically click to start download
  document.body.removeChild(a);      // Clean up the temporary element
  URL.revokeObjectURL(a.href);        // Release the object URL to free memory
}

// WELCOME SCREEN
// ==================================================
/**
 * renderWelcome()
 * Injects the initial welcome card into the chat area.
 * Called once on page load and again after clearChat() to restore the
 * default state.  The card lists the five AI agent capabilities as pills
 * so new users immediately understand what the platform can do.
 */
function renderWelcome() {
  var area = document.getElementById("chatArea");
  var row  = document.createElement("div");
  row.className = "msg-row"; // Renders like a normal AI message row

  // AI avatar — "E" for EduSphere
  var av = document.createElement("div");
  av.className = "msg-avatar ai";
  av.textContent = "E";

  var cnt = document.createElement("div");
  cnt.className = "msg-content";

  // The welcome-card contains heading, description, and agent-capability pills
  var card = document.createElement("div");
  card.className = "welcome-card";
  card.innerHTML =
    '<h2>Welcome to EduSphere AI</h2>' +
    '<p>Your intelligent educational assistant for government and rural schools in Gujarat, India.<br>' +
    'Select a mode from the sidebar, configure your profile above, and start learning. I support English and Gujarati.</p>' +
    '<div class="welcome-agents">' +
      '<div class="agent-pill">&#128216; <span>Personalized Learning</span></div>' +
      '<div class="agent-pill">&#128203; <span>Lesson Plan Generator</span></div>' +
      '<div class="agent-pill">&#128202; <span>Performance Analytics</span></div>' +
      '<div class="agent-pill">&#9989; <span>Assessment &amp; Feedback</span></div>' +
      '<div class="agent-pill">&#128104;&#8205;&#127979; <span>Teacher Assistant</span></div>' +
    '</div>';

  var timeEl = document.createElement("div");
  timeEl.className = "msg-time";

  cnt.appendChild(card);

}

// ==================================================
// INPUT EVENTS
// ==================================================
// Auto-grow: resize the textarea as the user types, capped at 120 px height.
// Setting height to "auto" first forces the browser to recalculate scrollHeight.
document.getElementById("userInput").addEventListener("input", function() {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 120) + "px";
});

// Keyboard shortcut: Enter alone sends the message; Shift+Enter adds a newline.
document.getElementById("userInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault(); // Stop the default newline insertion
    sendMessage();
  }
});

// ==================================================
// INIT
// ==================================================
// Render the welcome card immediately when the page loads
renderWelcome();
</script>
